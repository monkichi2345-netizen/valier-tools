<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALIER 出品サポートツール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f9f8f6;--surface:#ffffff;--border:#e0ddd8;--border-hover:#bbb8b2;
    --text:#1a1a1a;--text-muted:#777;--text-hint:#aaa;
    --accent:#1a1a1a;--accent-fg:#fff;
    --success:#1a7f4b;--success-bg:#edfaf3;
    --danger:#c0392b;--danger-bg:#fdf0ee;
    --radius:10px;--radius-sm:6px;
  }
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:1.7;min-height:100vh;padding:24px 16px 60px}
  .container{max-width:680px;margin:0 auto}
  header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
  header h1{font-size:18px;font-weight:500;letter-spacing:0.08em}
  header p{font-size:12px;color:var(--text-muted);margin-top:4px}
  .step{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
  .step-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step-title{font-size:14px;font-weight:500}
  .field{margin-bottom:14px}.field:last-child{margin-bottom:0}
  label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:5px}
  input[type=text],textarea{width:100%;font-family:'Noto Sans JP',sans-serif;font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);outline:none;transition:border-color .15s}
  input[type=text]:focus,textarea:focus{border-color:var(--border-hover)}
  textarea{resize:vertical;line-height:1.7}
  .search-row{display:flex;gap:8px}
  .search-row input{flex:1}
  .search-btn{padding:9px 18px;background:var(--accent);color:var(--accent-fg);border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:'Noto Sans JP',sans-serif;transition:opacity .15s}
  .search-btn:hover{opacity:.85}.search-btn:disabled{opacity:.4;cursor:not-allowed}
  .product-card{background:#f5f4f1;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;min-height:38px;display:flex;align-items:center;word-break:break-all}
  .product-card.empty{color:var(--text-hint)}
  .rank-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .rank-btn{padding:9px 4px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;cursor:pointer;font-family:'Noto Sans JP',sans-serif;color:var(--text);text-align:center;transition:all .1s;line-height:1.4}
  .rank-btn:hover{border-color:var(--border-hover);background:#f5f4f1}
  .rank-btn.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rank-desc{font-size:10px;color:var(--text-muted);margin-top:2px}
  .rank-btn.sel .rank-desc{color:rgba(255,255,255,.7)}
  .upload-area{border:1px dashed var(--border);border-radius:var(--radius-sm);padding:22px;text-align:center;cursor:pointer;color:var(--text-muted);font-size:13px;transition:background .15s}
  .upload-area:hover{background:#f5f4f1}
  .img-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .img-thumb{width:72px;height:72px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border)}
  .gen-btn{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-top:6px;transition:opacity .15s;letter-spacing:0.05em}
  .gen-btn:hover{opacity:.88}.gen-btn:disabled{opacity:.35;cursor:not-allowed}
  .output-area{margin-top:20px}
  .out-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
  .out-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .out-label{font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:0.06em}
  .char-badge{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--success-bg);color:var(--success);font-weight:500}
  .char-badge.over{background:var(--danger-bg);color:var(--danger)}
  .out-actions{display:flex;align-items:center;gap:8px}
  .copy-btn{font-size:12px;padding:4px 12px;background:transparent;border:1px solid var(--border);border-radius:20px;cursor:pointer;color:var(--text-muted);font-family:'Noto Sans JP',sans-serif;transition:all .15s}
  .copy-btn:hover{border-color:var(--border-hover);color:var(--text)}
  .out-text{font-size:13px;color:var(--text);line-height:1.85;white-space:pre-wrap;word-break:break-all;font-family:'Noto Sans JP',sans-serif}
  .status{font-size:12px;padding:5px 0;margin-top:6px}
  .status.ok{color:var(--success)}.status.err{color:var(--danger)}
  .loading{display:flex;align-items:center;gap:8px;padding:16px 0;color:var(--text-muted);font-size:13px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block;animation:pulse 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .voice-row{display:flex;gap:8px;align-items:flex-start}
  .voice-row textarea,.voice-row input{flex:1}
  .voice-btn{flex-shrink:0;width:38px;height:38px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0}
  .voice-btn:hover{background:#f5f4f1}
  .voice-btn.recording{background:var(--danger);border-color:var(--danger);animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
  .accessory-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .acc-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;transition:all .1s}
  .acc-item:hover{border-color:var(--border-hover);background:#f5f4f1}
  .acc-item input[type=checkbox]{width:14px;height:14px;cursor:pointer;flex-shrink:0}
</style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="container">
  <header>
    <h1>VALIER 出品サポートツール</h1>
    <p>管理番号を入力してタイトル・説明文を自動生成します</p>
  </header>

  <div class="step">
    <div class="step-header"><div class="step-num">1</div><span class="step-title">管理番号で商品を検索</span></div>
    <div class="field">
      <label>管理番号</label>
      <div class="search-row">
        <input type="text" id="mgmt-num" placeholder="例：115162（6桁）" onkeydown="if(event.key==='Enter')fetchProduct()"/>
        <button class="voice-btn" onclick="startVoice('mgmt-num', this)" title="音声入力">🎤</button>
        <button class="search-btn" id="search-btn" onclick="fetchProduct()">検索</button>
      </div>
      <div id="search-status"></div>
    </div>
    <div class="field">
      <label>商品名（スプレッドシートから取得）</label>
      <div class="product-card empty" id="product-name">管理番号を検索すると表示されます</div>
    </div>
    <div id="folder-btn-area"></div>
  </div>

  <div class="step">
    <div class="step-header"><div class="step-num">2</div><span class="step-title">商品状態ランク</span></div>
    <div class="rank-grid">
      <button class="rank-btn" onclick="selRank(this,'S')"><div>S</div><div class="rank-desc">未使用保管品</div></button>
      <button class="rank-btn" onclick="selRank(this,'SA')"><div>SA</div><div class="rank-desc">未使用級</div></button>
      <button class="rank-btn" onclick="selRank(this,'A')"><div>A</div><div class="rank-desc">極美品</div></button>
      <button class="rank-btn" onclick="selRank(this,'AB+')"><div>AB+</div><div class="rank-desc">AB上位</div></button>
      <button class="rank-btn" onclick="selRank(this,'AB')"><div>AB</div><div class="rank-desc">美品</div></button>
      <button class="rank-btn" onclick="selRank(this,'AB-')"><div>AB-</div><div class="rank-desc">AB下位</div></button>
      <button class="rank-btn" onclick="selRank(this,'B+')"><div>B+</div><div class="rank-desc">B上位</div></button>
      <button class="rank-btn" onclick="selRank(this,'B')"><div>B</div><div class="rank-desc">難あり</div></button>
      <button class="rank-btn" onclick="selRank(this,'B-')"><div>B-</div><div class="rank-desc">B下位</div></button>
      <button class="rank-btn" onclick="selRank(this,'BC')"><div>BC</div><div class="rank-desc">ジャンク</div></button>
    </div>
  </div>

  <div class="step">
    <div class="step-header"><div class="step-num">3</div><span class="step-title">状態・サイズ・画像</span></div>
    <div class="field">
      <label>状態の特記事項（現品票より）</label>
      <div class="voice-row">
        <textarea id="condition-note" rows="3" placeholder="例：ハンドルにスレあり、内側に薄い変色、クリーニング済み"></textarea>
        <button class="voice-btn" onclick="startVoice('condition-note', this)" title="音声入力">🎤</button>
      </div>
    </div>
    <div class="field">
      <label>採寸データ</label>
      <div class="voice-row">
        <textarea id="size-data" rows="2" placeholder="例：W28×H20×D12cm　持ち手:30cm　ショルダー:最長120cm"></textarea>
        <button class="voice-btn" onclick="startVoice('size-data', this)" title="音声入力">🎤</button>
      </div>
    </div>
    <div class="field">
      <label>付属品</label>
      <div class="accessory-grid">
        <label class="acc-item"><input type="checkbox" data-output="ギャランティカード類"> ギャランティカード</label>
        <label class="acc-item"><input type="checkbox" data-output="ケアカード類"> ケアカード</label>
        <label class="acc-item"><input type="checkbox" data-output="カード類"> その他カード類</label>
        <label class="acc-item"><input type="checkbox" data-output="保存袋"> 保存袋</label>
        <label class="acc-item"><input type="checkbox" data-output="箱"> 箱</label>
        <label class="acc-item"><input type="checkbox" data-output="ショルダーストラップ"> ショルダーストラップ</label>
        <label class="acc-item"><input type="checkbox" data-output="社外ショルダーストラップ"> 社外ショルダーストラップ</label>
      </div>
      <div class="voice-row" style="margin-top:8px">
        <input type="text" id="accessory-other" placeholder="その他（例：ベルト、鍵など）"/>
        <button class="voice-btn" onclick="startVoice('accessory-other', this)" title="音声入力">🎤</button>
      </div>
    </div>
    <div class="field">
      <label>商品画像（複数可）</label>
      <div class="upload-area" onclick="document.getElementById('img-input').click()">
        クリックして画像を追加（複数選択可）
      </div>
      <input type="file" id="img-input" accept="image/*" multiple style="display:none" onchange="handleImages(this)"/>
      <div class="img-preview" id="img-preview"></div>
    </div>
  </div>

  <button class="gen-btn" id="gen-btn" onclick="generate()">タイトル・説明文を生成</button>
  <div class="output-area" id="output-area"></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxoKt9aw5wYYNh_2tShPRhyXS1KzmO9syc61ZvjSOB6d3w2mxQmqfg9OTv62TBlIUx_/exec';
const DRIVE_CLIENT_ID = '24568286649-p64c441e8mrgutb8p81e7it3jg2u8v7e.apps.googleusercontent.com';
const DRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
let driveAccessToken = null;

async function getAccessToken() {
  return new Promise((resolve, reject) => {
    if (driveAccessToken) { resolve(driveAccessToken); return; }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPES,
      callback: (response) => {
        if (response.error) { reject(response.error); return; }
        driveAccessToken = response.access_token;
        resolve(driveAccessToken);
      }
    });
    client.requestAccessToken();
  });
}

async function downloadAllImages(folderUrl) {
  // フォルダIDを取得
  const match = folderUrl.match(/folders\/([a-zA-Z0-9_-]+)/);
  if (!match) { alert('フォルダURLが不正です'); return; }
  const folderId = match[1];

  // Google Drive APIでファイル一覧取得（OAuth済みトークン使用）
  try {
    const token = await getAccessToken();
    const res = await fetch(
      `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)`,
      { headers: { Authorization: `Bearer ${token}` } }
    );
    const data = await res.json();
    const files = (data.files || []).filter(f => f.mimeType.startsWith('image/'));
    if (files.length === 0) { alert('画像が見つかりませんでした'); return; }

    // 1枚ずつダウンロード
    for (const file of files) {
      const imgRes = await fetch(
        `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,
        { headers: { Authorization: `Bearer ${token}` } }
      );
      const blob = await imgRes.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      a.click();
      URL.revokeObjectURL(url);
      await new Promise(r => setTimeout(r, 500));
    }
    alert(`${files.length}枚のダウンロードが完了しました！`);
  } catch(err) {
    alert('ダウンロードエラー：' + err.message);
  }
}

let selectedRank = '';
let productName = '';
let productPrice = null;
let imageDataList = [];

function searchFolder(mgmtNum) {
  // Google DriveのURLを管理番号フォルダ検索URLに変更
  const link = document.getElementById('folder-link');
  if (link) {
    link.href = `https://drive.google.com/drive/search?q=${mgmtNum}`;
  }
}

function selRank(btn, rank) {
  selectedRank = rank;
  document.querySelectorAll('.rank-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}

async function fetchProduct() {
  const num = document.getElementById('mgmt-num').value.trim();
  if (!num) return;
  const btn = document.getElementById('search-btn');
  const status = document.getElementById('search-status');
  btn.disabled = true;
  status.innerHTML = '<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:6px">検索中...</span></div>';
  try {
    const res = await fetch(`${GAS_URL}?id=${encodeURIComponent(num.slice(0,4))}&fullId=${encodeURIComponent(num)}`);
    const data = await res.json();
    if (data.name) {
      productName = data.name;
      const rawPrice = data.price ? String(data.price).replace(/,/g, '').trim() : null;
      productPrice = (rawPrice && /^\d+$/.test(rawPrice)) ? rawPrice : null;
      const card = document.getElementById('product-name');
      card.textContent = productName;
      card.classList.remove('empty');

      // ランク自動反映（完全一致）
      if (data.rank) {
        const rank = data.rank.toString().trim();
        document.querySelectorAll('.rank-btn').forEach(b => b.classList.remove('sel'));
        document.querySelectorAll('.rank-btn').forEach(b => {
          const btnRank = b.querySelector('div:first-child').textContent.trim();
          if (btnRank === rank) {
            b.classList.add('sel');
            selectedRank = rank;
          }
        });
      }

      // 採寸データ自動反映
      if (data.sizeData) document.getElementById('size-data').value = data.sizeData;

      // 状態メモ自動反映
      if (data.condNote) document.getElementById('condition-note').value = data.condNote;

      // 付属品自動反映
      if (data.accData) {
        const accList = data.accData.split('、');
        document.querySelectorAll('.accessory-grid input[type="checkbox"]').forEach(cb => {
          cb.checked = accList.includes(cb.dataset.output);
        });
        // フリーワード（チェックボックス以外）
        const knownAcc = ['ギャランティカード類','ケアカード類','カード類','保存袋','箱','ショルダーストラップ','社外ショルダーストラップ'];
        const freeWords = accList.filter(a => !knownAcc.includes(a));
        if (freeWords.length > 0) document.getElementById('accessory-other').value = freeWords.join('、');
      }

      status.innerHTML = '<div class="status ok">取得しました</div>';

      // 画像フォルダボタン表示
      if (data.folderUrl) {
        document.getElementById('folder-btn-area').innerHTML = `
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
            <a href="${data.folderUrl}" target="_blank"
               style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#f5f4f1;border:1px solid #e0ddd8;border-radius:6px;font-size:13px;color:#1a1a1a;text-decoration:none;">
              📁 画像フォルダを開く
            </a>
            <button onclick="downloadAllImages('${data.folderUrl}')"
               style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#f5f4f1;border:1px solid #e0ddd8;border-radius:6px;font-size:13px;color:#1a1a1a;cursor:pointer;">
              ⬇️ 画像を一括ダウンロード
            </button>
          </div>`;
        window._currentFolderUrl = data.folderUrl;
      } else {
        document.getElementById('folder-btn-area').innerHTML = '';
      }
    } else {
      status.innerHTML = '<div class="status err">管理番号が見つかりませんでした</div>';
      document.getElementById('product-name').textContent = '管理番号を検索すると表示されます';
      document.getElementById('product-name').classList.add('empty');
      productName = '';
      productPrice = null;
    }
  } catch(e) {
    status.innerHTML = `<div class="status err">接続エラー：${e.message}</div>`;
  }
  btn.disabled = false;
}

function handleImages(input) {
  const files = Array.from(input.files);
  const preview = document.getElementById('img-preview');
  imageDataList = [];
  preview.innerHTML = '';
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      imageDataList.push({ base64: e.target.result.split(',')[1], type: file.type });
      const img = document.createElement('img');
      img.src = e.target.result;
      img.className = 'img-thumb';
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

function copyText(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
  const btn = event.target;
  btn.innerText = 'コピー済み';
  setTimeout(() => btn.innerText = 'コピー', 1500);
}

async function generate() {
  if (!productName) { alert('先に管理番号を検索してください'); return; }
  if (!selectedRank) { alert('商品状態ランクを選択してください'); return; }

  const btn = document.getElementById('gen-btn');
  btn.disabled = true;
  const area = document.getElementById('output-area');
  area.innerHTML = '<div class="loading" style="margin-top:1rem"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:6px">生成中...</span></div>';

  const condNote = document.getElementById('condition-note').value.trim();
  const checkedAcc = [];
  document.querySelectorAll('.accessory-grid input[type="checkbox"]').forEach(cb => {
    if (cb.checked && cb.dataset.output) checkedAcc.push(cb.dataset.output);
  });
  const accOther = document.getElementById('accessory-other').value.trim();
  if (accOther) checkedAcc.push(accOther);
  const accText = checkedAcc.length > 0 ? checkedAcc.join('、') : 'なし、本体のみ\n画像の装飾品は付属しません。';
  const sizeData = document.getElementById('size-data').value.trim();
  const mgmtNum = document.getElementById('mgmt-num').value.trim();

  const rankComment = {
    'S':'未使用保管品と判断できる程、素晴らしいコンディションです。プレゼント・ギフトにもおすすめできるお品物です。',
    'SA':'極わずかな使用感はあるものの、ほとんど使用感を感じさせない、大変状態の良い素晴らしいコンディションのお品です。',
    'A':'多少のスレや使用感はありますが、全体的に状態の良いキレイなお品物です。',
    'AB+':'使用感やダメージはありますが、その他全体的にはキレイな状態を保ったお品です。',
    'AB':'使用感やダメージはありますが、その他全体的にはキレイな状態を保ったお品です。',
    'AB-':'使用感やダメージはありますが、その他全体的にはキレイな状態を保ったお品です。',
    'B+':'使用感やダメージがございます。画像をよくご確認ください。',
    'B':'使用感やダメージがございます。画像をよくご確認ください。',
    'B-':'使用感やダメージがございます。画像をよくご確認ください。',
    'BC':'大きなダメージや目立つ汚れなどがございます。画像をよくご確認ください。'
  };

  const rankDescMap = {
    'S':'S：未使用品と評価できる程使用感・ダメージの無いお品',
    'SA':'SA：ダメージのほとんどない未使用品に近いお品',
    'A':'A：目立ちにくいダメージや使用感はあるが、全体的に状態が良いお品',

let recognition = null;
let activeVoiceBtn = null;

function startVoice(targetId, btn) {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('このブラウザは音声入力に対応していません。Chromeをお使いください。');
    return;
  }

  // 録音中なら停止
  if (recognition && activeVoiceBtn === btn) {
    recognition.stop();
    return;
  }

  // 他の録音中なら停止
  if (recognition) recognition.stop();

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = false;
  recognition.interimResults = false;

  activeVoiceBtn = btn;
  btn.classList.add('recording');

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    const el = document.getElementById(targetId);
    el.value += (el.value ? '、' : '') + transcript;
  };

  recognition.onend = () => {
    btn.classList.remove('recording');
    activeVoiceBtn = null;
    recognition = null;
  };

  recognition.onerror = (e) => {
    btn.classList.remove('recording');
    activeVoiceBtn = null;
    recognition = null;
  };

  recognition.start();
}

async function saveAndReset(mgmtNum) {
  const workerCode = document.getElementById('worker-select').value;

  const saveBtn = event.target;

  saveBtn.disabled = true;
  saveStatus.innerHTML = '<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:6px">保存中...</span></div>';

  try {
    await fetch(`${GAS_URL}?action=save&id=${encodeURIComponent(mgmtNum)}&workerCode=${encodeURIComponent(workerCode)}`);
    saveStatus.innerHTML = '<div class="status ok">保存しました！リセットします...</div>';
    setTimeout(() => {
      document.getElementById('mgmt-num').value = '';
